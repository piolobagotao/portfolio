<svg width="100%" viewBox="0 0 680 270" role="img" xmlns="http://www.w3.org/2000/svg" style="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &#34;Segoe UI&#34;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">From messages sent to opportunities created</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &#34;Segoe UI&#34;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">237 messages were sent to existing customers over four months. 176 customers replied, 74 percent. 36 opportunities were created, 15 percent of messages sent.</desc>
