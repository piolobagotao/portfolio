<svg width="100%" viewBox="0 0 680 290" role="img" xmlns="http://www.w3.org/2000/svg" style="" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &#34;Segoe UI&#34;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">The Mount AI traffic shape</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &#34;Segoe UI&#34;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Organic traffic climbs steeply, peaks between three and six months, then falls to a level below where the site started.</desc>
